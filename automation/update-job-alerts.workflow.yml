name: Update job alerts

on:
  schedule:
    # Check once every six hours (cron uses UTC; GitHub may start it a little late).
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: automatic-job-alerts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'EmploymentExpress/homepage'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation/requirements.txt

      - name: Install PDF reader
        run: python -m pip install --disable-pip-version-check -r automation/requirements.txt

      - name: Test alert parser
        run: python -m unittest discover -s tests -v

      - name: Check official websites for new alerts
        run: python scripts/update_jobs.py

      - name: Commit newly discovered alerts
        shell: bash
        run: |
          if git diff --quiet -- data/auto-jobs.json data/seen-notices.json; then
            echo "No new recruitment notices were found."
            exit 0
          fi

          git config user.name "employment-express-alert-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/auto-jobs.json data/seen-notices.json
          git commit -m "chore: publish automatic job alerts"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
