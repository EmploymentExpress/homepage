<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Opening Offline Application Form — EMPLOYMENT EXPRESS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white max-w-md w-full rounded-2xl shadow-sm border border-slate-200 p-8 text-center">
        <div class="w-14 h-14 mx-auto rounded-full bg-emerald-100 flex items-center justify-center mb-4">
            <svg class="w-7 h-7 text-emerald-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
            </svg>
        </div>
        <h1 class="font-extrabold text-slate-900 text-lg mb-1">Opening Offline Application Form</h1>
        <p id="status" class="text-sm text-slate-500">Loading the offline application form…</p>
        <p class="text-[11px] text-slate-400 mt-4 leading-relaxed">
            The offline application form is provided by the recruiting authority and
            opens in a new window. If it does not open automatically, use the button below.
        </p>
        <a id="manual" href="#" target="_blank" rel="noopener noreferrer" class="hidden mt-4 inline-block px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white font-bold rounded-lg text-sm transition">
            Open Offline Application Form
        </a>
    </div>

    <script>
        (function () {
            var params = new URLSearchParams(window.location.search);
            var token = params.get('f') || params.get('id') || '';
            var statusEl = document.getElementById('status');
            var manualEl = document.getElementById('manual');

            function fail() {
                statusEl.textContent = 'This offline form link is no longer available. Please check the job alert on the homepage.';
            }

            if (!token) { fail(); return; }

            fetch('data/offline-redirects.json', { cache: 'no-store' })
                .then(function (r) { if (!r.ok) throw new Error('map'); return r.json(); })
                .then(function (payload) {
                    var map = (payload && payload.redirects) || {};
                    var target = map[token];
                    if (!target) { fail(); return; }
                    manualEl.href = target;
                    manualEl.classList.remove('hidden');
                    statusEl.textContent = 'Redirecting…';
                    setTimeout(function () { window.location.replace(target); }, 400);
                })
                .catch(function () { fail(); });
        })();
    </script>
</body>
</html>
