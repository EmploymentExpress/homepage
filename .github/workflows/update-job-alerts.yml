name: Update job alerts on: schedule: # Check once every six hours (cron uses UTC; GitHub may start it a little late). - cron: "17 */6 * * *" workflow_dispatch: permissions: contents: write concurrency: group: automatic-job-alerts-${{ github.ref }} cancel-in-progress: false jobs: update: if: github.repository == 'EmploymentExpress/homepage' runs-on: ubuntu-latest timeout-minutes: 20 steps: - name: Check out website uses: actions/checkout@v4 with: fetch-depth: 0 - name: Set up Python uses: actions/setup-python@v5 with: python-version: "3.12" cache
