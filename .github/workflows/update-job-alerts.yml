# Scheduled official-website monitor.

#

# Page-source rule (mandatory, runs on EVERY run of this workflow):

# the "Check official websites for new alerts" step (scripts/update_jobs.py)

# first checks each enabled official website listing; if no new job

# notification is found there, it re-reads the RAW page source of that

# official website (noscript blocks, iframe/embed PDF embeds, area maps,

# data-* hooks, bare URLs in scripts/JSON) and publishes only links found

# there. The rule applies automatically to every official website link in

# automation/sources.json, automation/official-organizations.json and

# data/notification-source-links.json — existing or added later — with no

# extra configuration. Do not remove or bypass that step; details are in

# AGENTS.md ("Workflow automation page-source rule") and the guard tests in

# tests/test_update_jobs.py.

name: Update job alerts

on:

schedule:

# Check once every six hours (cron uses UTC; GitHub may start it a little late).

- cron: "17 */6 * * *"

workflow_dispatch:

permissions:

contents: write

concurrency:

group: automatic-job-alerts-${{ github.ref }}

cancel-in-progress: false

jobs:

update:

if: github.repository == 'EmploymentExpress/homepage'

runs-on: ubuntu-latest

timeout-minutes: 90

steps:

- name: Check out website

uses: actions/checkout@v5

with:

ref: ${{ github.ref_name }}

fetch-depth: 0

- name: Set up Python

uses: actions/setup-python@v6

with:

python-version: "3.12"

cache: pip

cache-dependency-path: automation/requirements.txt

- name: Install PDF reader

run: python -m pip install --disable-pip-version-check -r automation/requirements.txt

- name: Test alert parser

run: python -m unittest discover -s tests -v

- name: Check official websites for new alerts

run: python scripts/update_jobs.py

- name: Commit newly discovered alerts

shell: bash

run: |

# actions/checkout can leave the worktree on a detached HEAD. Make

# sure the commit is attached to the branch that triggered this run;

# otherwise `git pull --rebase` exits with 128 before the push.

git checkout "${GITHUB_REF_NAME}"

# The monitor may also register newly discovered official websites in

# data/notification-source-links.json. Keep that registry in the same

# commit; leaving it unstaged makes the later rebase fail with

# "cannot pull with rebase: You have unstaged changes".

DATA_FILES=(

data/auto-jobs.json

data/seen-notices.json

data/offline-redirects.json

data/notification-source-links.json

)

# Check if there are actual modifications in the generated data files.

if [ -z "$(git status --porcelain -- "${DATA_FILES[@]}")" ]; then

echo "No new recruitment notices were found."

exit 0

fi

git config user.name "employment-express-alert-bot"

git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

# Stage only the generated data files, never the protected homepage.

git add -- "${DATA_FILES[@]}"

git commit -m "chore: publish automatic job alerts [skip ci]"

# The parser is data-only. Fail clearly instead of allowing an

# unexpected unstaged change to break `git pull --rebase` opaquely.

if [ -n "$(git status --porcelain)" ]; then

echo "Unexpected unstaged changes remain after publishing alert data:" >&2

git status --short >&2

exit 1

fi

# checkout persists the workflow token in the local credential helper.

# Rebase onto concurrent alert commits, then push the resulting branch.

for attempt in 1 2 3; do

if git pull --re

