# Scheduled official-website monitor.
#
# Page-source rule (mandatory, runs on EVERY run of this workflow):
# the "Check official websites for new alerts" step (scripts/update_jobs.py)
# first checks each enabled official website listing; if no new job
# notification is found there, it re-reads the RAW page source of that
# official website (noscript blocks, iframe/embed PDF embeds, area maps,
# data-* hooks, bare URLs in scripts/JSON) and publishes only links found
# there. The rule applies automatically to every official website link in
# automation/sources.json, automation/official-organizations.json and
# data/notification-source-links.json — existing or added later — with no
# extra configuration. Do not remove or bypass that step; details are in
# AGENTS.md ("Workflow automation page-source rule") and the guard tests in
# tests/test_update_jobs.py.
name: Update job alerts

on:
  schedule:
    # Check once every six hours (cron uses UTC; GitHub may start it a little late).
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: automatic-job-alerts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'EmploymentExpress/homepage'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out website
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation/requirements.txt

      - name: Install PDF reader
        run: python -m pip install --disable-pip-version-check -r automation/requirements.txt

      - name: Test alert parser
        run: python -m unittest discover -s tests -v

      - name: Check official websites for new alerts
        run: python scripts/update_jobs.py

      - name: Commit newly discovered alerts
        shell: bash
        run: |
          # actions/checkout leaves a detached HEAD. Switch to the real branch so
          # that `git pull --rebase`/`git push` operate on a branch rather than a
          # detached HEAD (a detached HEAD is what made the step fail with exit 128).
          git checkout "${GITHUB_REF_NAME}"

          # The monitor may also refresh data/offline-redirects.json (offline
          # application-form links), so commit that alongside the alerts.
          DATA_FILES="data/auto-jobs.json data/seen-notices.json data/offline-redirects.json"
          if git diff --quiet -- $DATA_FILES; then
            echo "No new recruitment notices were found."
            exit 0
          fi

          git config user.name "employment-express-alert-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $DATA_FILES
          git commit -m "chore: publish automatic job alerts"

          # Rebase onto any concurrent commits and push, retrying transient
          # fetch/push failures instead of failing the whole run once.
          for attempt in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" \
                && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Published new alerts successfully."
              exit 0
            fi
            echo "Commit/push attempt ${attempt} failed; retrying in 15s..."
            sleep 15
          done
          exit 1
